name: Scrape SIGAA Cursos e Estruturas Curriculares

on:
  schedule:
    # Executa mensalmente no dia 1 às 04:00 UTC (01:00 BRT)
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      enrich_limit:
        description: 'Limite de componentes com pré-requisitos/equivalências enriquecidos por estrutura (0 = sem limite)'
        required: false
        default: '0'

concurrency:
  group: scrape-sigaa-data
  cancel-in-progress: false

jobs:
  scrape-shards:
    name: Scrape Cursos (Parte ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar scraping da Parte ${{ matrix.shard }}
        run: |
          SHARD_NUM=$(echo "${{ matrix.shard }}" | tr '/' '-')
          pnpm run scrape:courses \
            --shard "${{ matrix.shard }}" \
            --enrich-limit "${{ inputs.enrich_limit || '0' }}" \
            --out-dir "./dist-shard-$SHARD_NUM"

      - name: Upload artifact do shard
        uses: actions/upload-artifact@v4
        with:
          name: courses-shard-${{ matrix.shard == '1/2' && '1' || '2' }}
          path: ./dist-shard-*
          retention-days: 1

  merge-and-publish:
    name: Unificar Shards e Publicar em gh-pages
    needs: scrape-shards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Baixar todos os artifacts dos shards
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-shards

      - name: Unificar dados dos shards
        run: |
          node scripts/merge-courses-shards.mjs \
            --parent-dir ./downloaded-shards \
            --out-dir ./dist-data

      - name: Publicar dados estáticos na branch órfã gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist-data
          destination_dir: data
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore(data): atualizar catálogo de cursos e matrizes curriculares [skip ci]'
